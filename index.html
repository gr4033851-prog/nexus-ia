<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Nexus IA</title>
  <style>
    body {
      background: #0f172a;
      color: #e5e7eb;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      background: #020617;
      padding: 20px;
      border-radius: 10px;
      width: 100%;
      max-width: 400px;
    }
    h1 {
      text-align: center;
      margin-bottom: 15px;
    }
    textarea {
      width: 100%;
      height: 80px;
      border-radius: 6px;
      border: none;
      padding: 10px;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    #resposta {
      margin-top: 15px;
      font-size: 14px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Nexus IA</h1>
    <textarea id="entrada" placeholder="Digite sua pergunta..."></textarea>
    <button onclick="responder()">Entrar</button>
    <div id="resposta">⚠️ Backend ainda não conectado.</div>
  </div>
  <script src="script.js"></script>
</body>
</html>
